<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

/* Product Grid */
.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-bottom:40px;
}

.product{
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    text-align:center;
}

.product img{
    width:100%;
    height:200px;
    object-fit:cover;
    border-radius:8px;
}

.product h3{
    margin:15px 0 10px;
}

.price{
    color:green;
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}

.btn{
    background:#007bff;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;
}

.btn:hover{
    background:#0056b3;
}

/* Cart */
.cart{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.cart h2{
    margin-bottom:20px;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid #ddd;
}

.total{
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
    text-align:right;
}

@media(max-width:768px){
    .cart-item{
        flex-direction:column;
        gap:5px;
    }
}
</style>
</head>
<body>

<div class="container">

    <h1>Shopping Cart Demo</h1>

    <!-- Products -->
    <div class="products">

        <div class="product">
            <img src="https://via.placeholder.com/300x200" alt="">
            <h3>Wireless Headphones</h3>
            <div class="price">$99</div>
            <button class="btn" onclick="addToCart('Wireless Headphones',99)">
                Add to Cart
            </button>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/300x200" alt="">
            <h3>Smart Watch</h3>
            <div class="price">$149</div>
            <button class="btn" onclick="addToCart('Smart Watch',149)">
                Add to Cart
            </button>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/300x200" alt="">
            <h3>Bluetooth Speaker</h3>
            <div class="price">$79</div>
            <button class="btn" onclick="addToCart('Bluetooth Speaker',79)">
                Add to Cart
            </button>
        </div>

    </div>

    <!-- Cart -->
    <div class="cart">
        <h2>Cart Items</h2>

        <div id="cartItems"></div>

        <div class="total">
            Total: $<span id="total">0</span>
        </div>
    </div>

</div>

<script>
let total = 0;

function addToCart(name, price){

    const cartItems = document.getElementById("cartItems");

    const item = document.createElement("div");
    item.classList.add("cart-item");

    item.innerHTML = `
        <span>${name}</span>
        <span>$${price}</span>
    `;

    cartItems.appendChild(item);

    total += price;
    document.getElementById("total").innerText = total;
}
</script>

</body>
</html>
